# Dependency updates (#21). Not a workflow: Dependabot only opens PRs, which CI then builds.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
        exclude-patterns: ["androidx.compose*", "androidx.test*"]
      compose:
        patterns: ["androidx.compose*"]
      kotlin-agp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.android.*"
          - "com.google.devtools.ksp*"
      test-libs:
        patterns: ["junit*", "androidx.test*", "org.robolectric*", "io.mockk*", "app.cash.turbine*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
