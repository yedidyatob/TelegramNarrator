name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties still carries the maintainer's Windows-only JDK path and
      # trust-store settings; command-line -D properties take precedence over it.
      # (TODO: move those to ~/.gradle/gradle.properties and drop these overrides.)
      - name: Unit tests and debug build
        run: >
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk