name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Inject Telegram API credentials from repo Actions secrets so the debug APK
      # can log in. Without them BuildConfig fields stay empty and the login screen errors.
      - name: Write Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            {
              echo "TELEGRAM_API_ID=$TELEGRAM_API_ID"
              echo "TELEGRAM_API_HASH=$TELEGRAM_API_HASH"
            } >> local.properties
            echo "Wrote TELEGRAM_API_* into local.properties for this build."
          else
            echo "::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set; the debug APK will show a login-screen error until they are configured under Settings → Secrets and variables → Actions."
          fi

      # gradle.properties still carries the maintainer's Windows-only JDK path and
      # trust-store settings; command-line -D properties take precedence over it.
      # (TODO: move those to ~/.gradle/gradle.properties and drop these overrides.)
      - name: Unit tests and debug build
        run: >
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare and encrypt debug APK artifact
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          mkdir -p artifact
          zip -j -P "$ARTIFACT_PASSPHRASE" artifact/TelegramNarrator-debug.zip app/build/outputs/apk/debug/*.apk

      - name: Upload encrypted debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramNarrator-debug
          path: artifact/TelegramNarrator-debug.zip
          retention-days: 14