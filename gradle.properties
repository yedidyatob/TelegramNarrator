# Project-wide Gradle settings.
# Machine-specific overrides (JDK path, etc.) belong in ~/.gradle/gradle.properties
# or local.properties — do not commit them here.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# App version (MAJOR.MINOR.PATCH). Bump before every Play upload; versionCode is derived from it
# (MAJOR*10000 + MINOR*100 + PATCH). Override per build with -PTN_VERSION_NAME=1.2.3. See docs/publishing.md.
TN_VERSION_NAME=1.0.0

# Android
android.useAndroidX=true
android.enableJetifier=false

# Build speed
org.gradle.caching=true
org.gradle.parallel=true
